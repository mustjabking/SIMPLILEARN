name: Continuous Lyra Deploy Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Surge CLI
        run: npm install -g surge

      - name: Deploy Direct HTML to lyra.surge.sh
        run: |
          # Publish direct to custom subdomain without token prompts
          surge --project . --domain lyra.surge.sh
