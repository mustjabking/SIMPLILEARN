name: Continuous Lyra Tunnel Engine

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Python Local HTTP Server
        run: |
          python3 -m http.server 3000 &
          sleep 2

      - name: Launch Serveo Tunnel for lyra
        run: |
          echo "Starting Serveo Tunnel..."
          # Serveo par custom subdomain ke sath SSH tunnel run karein
          ssh -o StrictHostKeyChecking=no -R lyra:80:localhost:3000 serveo.net &
          sleep 6
          echo "Tunnel active on Serveo!"

      - name: Keep Runner Active for 2 Hours
        run: |
          sleep 7200

      - name: Trigger Auto-Restart Loop via Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          date +%s > dummy.txt
          
          git add dummy.txt
          git commit -m "Auto-refreshing continuous tunnel session after 2 hours [skip ci]" || true
          git push origin main
