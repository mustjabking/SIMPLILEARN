name: Deploy Only HTML to TiniDrop

on:
  push:
    branches:
      - main  # Agar aapki branch master hai toh yahan master likhein

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploying with Domain Fallbacks
        run: |
          echo "Trying to deploy on ://tinidrop.com..."
          if npx tinidrop ./index.html --domain lyra; then
            echo "Successfully deployed to ://tinidrop.com"
          else
            echo "lyra was taken, trying ://tinidrop.com..."
            if npx tinidrop ./index.html --domain lyraai; then
              echo "Successfully deployed to ://tinidrop.com"
            else
              echo "lyraai was taken, deploying to ://tinidrop.com..."
              npx tinidrop ./index.html --domain lyramoon
            fi
          fi
