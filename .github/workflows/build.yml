name: Deploy Only HTML to Surge

on:
  push:
    branches:
      - main  # Agar aapki branch master hai toh yahan master likhein

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploying with Domain Fallbacks
        run: |
          echo "Trying to deploy on lyra.surge.sh..."
          if npx surge ./ --domain lyra.surge.sh --token 1234567890abcdef1234567890abcdef; then
            echo "Successfully deployed to lyra.surge.sh"
          else
            echo "lyra was taken, trying lyraai.surge.sh..."
            if npx surge ./ --domain lyraai.surge.sh --token 1234567890abcdef1234567890abcdef; then
              echo "Successfully deployed to lyraai.surge.sh"
            else
              echo "lyraai was taken, deploying to lyramoon.surge.sh..."
              npx surge ./ --domain lyramoon.surge.sh --token 1234567890abcdef1234567890abcdef
            fi
          fi
