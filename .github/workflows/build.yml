name: Deploy to Surge

on:
  push:
    branches:
      - main  # Agar aapki branch master hai toh master likhein

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploying to Surge
        run: |
          # Surge ko bina token ke temporary guest email ke saath deploy kar rahe hain
          npx surge ./ --domain lyramoon.surge.sh --token dummy_token_not_needed || npx surge ./ --domain lyraai.surge.sh
