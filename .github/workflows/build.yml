name: Deploy Only HTML to Hostless

on:
  push:
    branches:
      - main  # Agar aapki branch ka naam master hai, toh yahan master likhein

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploying with Domain Fallbacks
        run: |
          echo "Trying to deploy on lyra.hostless.site..."
          if npx hostless ./index.html --name lyra; then
            echo "Successfully deployed to lyra.hostless.site"
          else
            echo "lyra was taken, trying lyraai.hostless.site..."
            if npx hostless ./index.html --name lyraai; then
              echo "Successfully deployed to lyraai.hostless.site"
            else
              echo "lyraai was taken, deploying to lyramoon.hostless.site..."
              npx hostless ./index.html --name lyramoon
            fi
          fi
