<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyra Hub</title>
</head>
<body>
    <div id="app">Loading...</div>

    <script>
        async function init() {
            try {
                const host = window.location.hostname;
                const parts = host.split('.');
                let sub = parts.length > 3 ? parts[0] : 'main';

                if (sub === 'main' || sub === 'lyra') {
                    document.getElementById('app').innerHTML = "<h1>Welcome to Lyra Main Hub</h1>";
                    return;
                }

                const res = await fetch('./data.json');
                const data = await res.json();

                if (data[sub]) {
                    const fileRes = await fetch(data[sub]);
                    const html = await fileRes.text();
                    document.open();
                    document.write(html);
                    document.close();
                } else {
                    document.getElementById('app').innerHTML = "Subdomain not found!";
                }
            } catch (e) {
                document.getElementById('app').innerHTML = "Error loading site.";
            }
        }
        init();
    </script>
</body>
</html>
