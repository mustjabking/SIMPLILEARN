<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMPLILEARN — by Devil Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SIMPLILEARN — Created by Devil Developers
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7fb;
  --surface:#ffffff;
  --ink:#0b0d17;
  --ink-2:#1c2033;
  --muted:#697089;
  --line:#e7e9f2;
  --line-2:#dfe2ee;
  --brand:#5b4bff;
  --brand-2:#8b6bff;
  --cyan:#00b8ff;
  --pink:#ff4d9d;
  --ok:#0eab7a;
  --gold:#ffb020;
  --danger:#ef4444;
  --shadow-lg:0 40px 90px -45px rgba(20,24,70,.35);
  --shadow-md:0 24px 60px -34px rgba(20,24,70,.28);
  --shadow-sm:0 8px 24px -12px rgba(20,24,70,.18);
  --r-lg:28px;--r-md:20px;--r-sm:14px;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit}
img{max-width:100%}
.mono{font-family:'JetBrains Mono',monospace}

/* background */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg::before{content:'';position:absolute;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(123,97,255,.16),transparent 65%);top:-320px;left:-220px;filter:blur(18px)}
.bg::after{content:'';position:absolute;width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,184,255,.14),transparent 65%);bottom:-320px;right:-180px;filter:blur(18px)}
.bg .orb{position:absolute;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,77,157,.10),transparent 65%);top:36%;left:56%}
.bg .grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(11,13,23,.024) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(11,13,23,.024) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 72%);
  mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 72%)}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.78);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(231,233,242,.9)}
.topbar-in{max-width:1180px;margin:auto;padding:12px 24px;display:flex;align-items:center;
  justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#f0f1ff,#e6f7ff);
  display:grid;place-items:center;border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-sm);flex:0 0 auto}
.logo img{width:30px;height:30px;object-fit:contain}
.brand b{display:block;font-size:15px;letter-spacing:1.8px;font-weight:800;line-height:1.1}
.brand small{display:block;font-size:9px;letter-spacing:1.7px;color:var(--muted);
  font-weight:800;text-transform:uppercase;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.top-note{font-size:9.5px;letter-spacing:2px;font-weight:800;color:var(--muted);text-transform:uppercase}
.id-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.4px;
  box-shadow:var(--shadow-sm);max-width:240px;overflow:hidden}
.id-pill b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.id-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(14,171,122,.18);flex:0 0 auto}
.id-pill .v{font-size:8px;letter-spacing:1.4px;color:var(--ok);background:#ecfdf5;
  border:1px solid #c7f2df;padding:3px 6px;border-radius:999px}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:2.4px;
  font-weight:800;color:var(--brand);text-transform:uppercase}
.eyebrow.danger{color:var(--danger)}
.spark{width:7px;height:7px;border-radius:50%;background:var(--brand);
  box-shadow:0 0 0 4px rgba(91,75,255,.15)}
.grad{background:linear-gradient(120deg,#5b4bff,#00b8ff 55%,#ff4d9d);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 19px;border-radius:14px;border:1px solid transparent;font-size:13.5px;
  font-weight:800;letter-spacing:.2px;transition:transform .2s,box-shadow .2s,background .2s;
  text-decoration:none;line-height:1;white-space:nowrap}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.btn-primary{background:linear-gradient(135deg,#5b4bff,#8b6bff 48%,#00b8ff);color:#fff;
  box-shadow:0 14px 32px -12px rgba(91,75,255,.65)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 42px -14px rgba(91,75,255,.75)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:var(--shadow-sm)}
.btn-ghost:hover{background:#f8f9fe;transform:translateY(-2px)}
.btn-soft{background:#f1f2fa;color:var(--ink);border-color:transparent}
.btn-soft:hover{background:#e8eaf7}
.btn-sm{padding:9px 14px;font-size:11.5px;border-radius:11px}
.btn-block{width:100%;justify-content:center}

/* auth */
.auth{display:grid;grid-template-columns:1.06fr .94fr;background:#fff;border:1px solid var(--line);
  border-radius:34px;overflow:hidden;box-shadow:var(--shadow-lg);margin:26px 0 10px}
.auth-art{position:relative;padding:48px 46px;background:#0a0b14;color:#fff;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;min-height:610px}
.auth-art::before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(123,97,255,.62),transparent 65%);top:-200px;left:-160px;filter:blur(28px)}
.auth-art::after{content:'';position:absolute;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,184,255,.42),transparent 65%);bottom:-180px;right:-140px;filter:blur(28px)}
.art-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 76%);
  mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 76%)}
.auth-art > *{position:relative;z-index:2}
.art-brand{display:flex;align-items:center;gap:12px}
.logo.on-dark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);box-shadow:none}
.logo.on-dark img{filter:none}
.art-brand b{display:block;font-size:15px;letter-spacing:2px;font-weight:800}
.art-brand small{display:block;font-size:9px;letter-spacing:1.8px;color:#9aa1c4;font-weight:800;margin-top:2px}
.art-copy{margin:30px 0 24px}
.art-eyebrow{font-size:10px;letter-spacing:3.2px;font-weight:800;color:#b7a8ff}
.art-title{font-size:clamp(34px,3.5vw,48px);line-height:1.04;letter-spacing:-1.8px;
  font-weight:800;margin:16px 0 14px}
.art-sub{font-size:13.5px;line-height:1.7;color:#aab0d0;max-width:420px}
.art-features{display:grid;gap:13px;margin-top:24px}
.art-feature{display:flex;gap:11px;align-items:flex-start;font-size:12.5px;line-height:1.55;color:#c6c9dd}
.art-feature i{width:20px;height:20px;border-radius:7px;background:rgba(14,171,122,.16);
  border:1px solid rgba(14,171,122,.3);color:#4ade80;display:grid;place-items:center;
  font-size:10px;font-style:normal;font-weight:800;flex:0 0 auto}
.art-bottom{display:flex;gap:8px;flex-wrap:wrap}
.art-chip{padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);font-size:9px;letter-spacing:1.5px;font-weight:800;color:#dfe2ff}
.auth-form{padding:48px 46px;display:flex;flex-direction:column;justify-content:center}
.form-eyebrow{font-size:10px;letter-spacing:2.6px;font-weight:800;color:var(--brand)}
.auth-form h2{font-size:clamp(24px,2.6vw,32px);letter-spacing:-1px;margin:10px 0 8px}
.form-sub{font-size:13px;line-height:1.65;color:var(--muted);margin-bottom:8px}
.field{display:block;margin-top:22px}
.field > span{display:block;font-size:10px;letter-spacing:2px;font-weight:800;color:var(--muted);margin-bottom:9px}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--muted);pointer-events:none}
.field input{width:100%;padding:16px 16px 16px 48px;border-radius:16px;border:1.5px solid var(--line);
  background:#fbfbfe;font-size:15px;font-weight:700;color:var(--ink);outline:none;transition:.2s}
.field input::placeholder{color:#a3a8c0;font-weight:600}
.field input:focus{border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 4px rgba(91,75,255,.12)}
#loginForm .btn{margin-top:22px}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;
  font-size:11.5px;color:var(--muted);font-weight:700}
.link-btn{background:none;border:none;color:var(--brand);font-weight:800;font-size:11.5px;padding:0}
.link-btn:hover{text-decoration:underline}
.secure-note{display:flex;align-items:center;gap:8px;margin-top:24px;padding-top:18px;
  border-top:1px solid var(--line);font-size:10px;letter-spacing:.6px;color:var(--muted);font-weight:700}
.secure-note svg{width:14px;height:14px;flex:0 0 auto}

/* denied */
.denied{max-width:640px;margin:54px auto;text-align:center;background:#fff;border:1px solid var(--line);
  border-radius:32px;padding:48px 38px;box-shadow:var(--shadow-lg)}
.denied-icon{width:84px;height:84px;border-radius:26px;margin:0 auto 22px;display:grid;place-items:center;
  background:linear-gradient(135deg,#fff1f0,#fff7ed);border:1px solid #ffe0dc;font-size:34px}
.denied h1{font-size:clamp(24px,3.4vw,34px);line-height:1.15;letter-spacing:-1px;margin:14px 0 12px}
.denied h1 span{color:var(--danger)}
.denied p{font-size:13.5px;line-height:1.7;color:var(--muted)}
.denied p b{color:var(--ink)}
.denied-status{display:inline-flex;align-items:center;gap:8px;margin:18px 0 22px;padding:9px 14px;
  border-radius:999px;background:#fff7ed;border:1px solid #ffe0b2;font-size:10px;letter-spacing:1.6px;
  font-weight:800;color:#b45309}
.denied .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.denied small{display:block;margin-top:20px;font-size:10.5px;color:var(--muted);line-height:1.6}

/* dashboard */
.dash-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;
  padding:14px 0 8px}
.dash-title{font-size:clamp(34px,4.6vw,56px);line-height:1.03;letter-spacing:-2.2px;
  font-weight:800;margin:12px 0 12px}
.dash-sub{max-width:520px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.dash-stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{min-width:104px;padding:16px 18px;border-radius:18px;background:#fff;border:1px solid var(--line);
  text-align:center;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat span{display:block;font-size:8.5px;letter-spacing:1.8px;font-weight:800;color:var(--muted);margin-top:6px}

/* continue banner */
.continue{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);
  border-radius:22px;padding:18px 20px;margin-top:24px;box-shadow:var(--shadow-md);flex-wrap:wrap}
.continue-empty{background:linear-gradient(120deg,#fff,#f8f9ff)}
.continue-info{display:flex;align-items:center;gap:13px;flex:1;min-width:220px}
.continue-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;
  background:var(--c-soft,#f1f2fa);border:1px solid var(--c-line,#e7e9f2);flex:0 0 auto}
.continue-icon.empty{background:#f1f2fa;border-color:var(--line);font-size:20px}
.continue-tag{display:block;font-size:8.5px;letter-spacing:1.8px;font-weight:800;color:var(--brand);margin-bottom:2px}
.continue-info b{display:block;font-size:14.5px;letter-spacing:-.2px}
.continue-info small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.continue-progress{display:flex;align-items:center;gap:10px;min-width:170px;flex:0 0 auto}
.continue-track{width:120px;height:7px;border-radius:99px;background:#eef0f8;overflow:hidden}
.continue-track i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#5b4bff,#00b8ff);transition:width .6s}
.continue-progress span{font-size:11px;font-weight:800;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* section head */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  margin:38px 0 16px;flex-wrap:wrap}
.section-head h2{font-size:clamp(22px,2.6vw,30px);letter-spacing:-1px;margin-top:6px}
.section-note{font-size:10px;letter-spacing:1.8px;font-weight:800;color:var(--muted);text-transform:uppercase}

/* courses */
.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.course{--c:#5b4bff;--c-soft:rgba(91,75,255,.1);--c-line:rgba(91,75,255,.22);
  position:relative;background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;
  cursor:pointer;display:flex;flex-direction:column;min-height:250px;overflow:hidden;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s}
.course::before{content:'';position:absolute;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,var(--c),transparent 65%);opacity:.07;top:-110px;right:-90px;
  transition:opacity .3s;pointer-events:none}
.course:hover{transform:translateY(-6px);box-shadow:0 34px 70px -38px rgba(20,24,70,.4);
  border-color:var(--c-line)}
.course:hover::before{opacity:.16}
.course-main{display:flex;flex-direction:column;height:100%;position:relative;z-index:1}
.course-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.course-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;
  background:var(--c-soft);border:1px solid var(--c-line);flex:0 0 auto}
.course-tag{font-size:8.5px;letter-spacing:1.5px;font-weight:800;color:var(--muted);
  text-transform:uppercase;text-align:right;padding-top:4px}
.course h3{font-size:19px;letter-spacing:-.5px;line-height:1.2;margin-bottom:7px}
.course p{font-size:12px;line-height:1.6;color:var(--muted);min-height:38px}
.stars{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:15px;color:var(--gold);
  letter-spacing:2px}
.stars span{font-size:9.5px;letter-spacing:1px;color:var(--muted);font-weight:800}
.card-progress{display:flex;align-items:center;gap:9px;margin-top:14px}
.card-track{flex:1;height:6px;border-radius:99px;background:#eef0f8;overflow:hidden}
.card-track i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#5b4bff,#00b8ff)}
.card-progress span{font-size:10px;font-weight:800;color:var(--muted);
  font-family:'JetBrains Mono',monospace}
.course-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:auto;padding-top:18px}
.course-state{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.course-state.locked{color:#b45309}
.course-state.unlocked{color:var(--ok)}
.course-arrow{width:34px;height:34px;border-radius:50%;background:#f3f4fb;display:grid;place-items:center;
  font-size:15px;transition:.22s;flex:0 0 auto}
.course:hover .course-arrow{background:var(--c);color:#fff;transform:rotate(-45deg)}
.course.is-locked{opacity:.62;filter:saturate(.55)}
.course.is-locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.course.is-locked .course-arrow{background:#f3f4fb;color:inherit;transform:none}

/* featured */
.course.featured{grid-column:span 2;flex-direction:row;align-items:center;gap:20px;min-height:260px;
  background:
    radial-gradient(720px 320px at 100% 0%,rgba(123,97,255,.38),transparent 62%),
    radial-gradient(520px 320px at 0% 100%,rgba(0,184,255,.22),transparent 62%),
    #0b0d17;
  border-color:#1e2235;color:#fff}
.course.featured::before{display:none}
.course.featured:hover{box-shadow:0 42px 90px -46px rgba(91,75,255,.75);border-color:#3a3f66}
.course.featured .course-main{flex:1}
.course.featured .course-icon{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.course.featured h3{font-size:clamp(22px,2.3vw,27px);color:#fff;letter-spacing:-.8px}
.course.featured p{color:#aeb3cf;font-size:12.5px;min-height:auto}
.course.featured .course-tag{color:#b7a8ff}
.course.featured .course-state{color:#c7c9e0}
.course.featured .course-arrow{background:rgba(255,255,255,.1);color:#fff}
.course.featured:hover .course-arrow{background:var(--c);transform:rotate(-45deg)}
.feat-visual{position:relative;width:190px;height:190px;flex:0 0 auto;display:grid;place-items:center}
.feat-visual > span{font-size:64px;position:relative;z-index:2;filter:drop-shadow(0 20px 30px rgba(0,0,0,.4))}
.feat-visual small{position:absolute;bottom:2px;font-size:8px;letter-spacing:2px;font-weight:800;
  color:#c7c9e0;z-index:2}
.feat-ring{position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}
.feat-ring.r2{inset:28px;border-color:rgba(255,255,255,.1)}
.feat-ring::before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;
  background:var(--cyan);top:14px;left:22px;box-shadow:0 0 16px var(--cyan)}
.feat-ring.r2::before{background:var(--pink);top:auto;bottom:10px;left:auto;right:18px;
  box-shadow:0 0 16px var(--pink)}

/* footer */
.foot{text-align:center;margin-top:52px;font-size:11px;letter-spacing:.4px;color:var(--muted);line-height:1.7}
.foot b{color:var(--brand)}

/* player */
.player-wrap{max-width:1180px;margin:0 auto;padding:24px 24px 70px}
.player-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:16px}
.player-head h1{font-size:clamp(24px,3.2vw,36px);letter-spacing:-1.4px;margin-top:6px}
.player-progress-pill{padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:11px;font-weight:800;color:var(--muted);box-shadow:var(--shadow-sm)}
.player-progress-pill b{color:var(--brand);font-size:13px}
.player-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.video-card{background:#0b0d17;border-radius:28px;overflow:hidden;
  box-shadow:0 40px 90px -50px rgba(0,0,0,.55);border:1px solid #171a29}
.video-shell{position:relative;aspect-ratio:16/9;background:#0b0d17;overflow:hidden}
.video-shell iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-mount{position:absolute;inset:0}
.yt-mount iframe{width:100%;height:100%}
.poster{position:absolute;inset:0;z-index:3;display:grid;place-items:center;cursor:pointer;
  background:#0b0d17;transition:opacity .45s ease,visibility .45s;overflow:hidden}
.poster.hide{opacity:0;visibility:hidden;pointer-events:none}
.poster-bg{position:absolute;inset:0;background:
  radial-gradient(620px 320px at 15% 10%,rgba(91,75,255,.55),transparent 60%),
  radial-gradient(520px 320px at 90% 90%,rgba(0,184,255,.4),transparent 60%),
  radial-gradient(420px 320px at 80% 20%,rgba(255,77,157,.25),transparent 60%),
  #0b0d17}
.poster-bg::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:42px 42px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 76%);
  mask-image:radial-gradient(ellipse at center,#000 20%,transparent 76%)}
.poster-center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
  gap:22px;padding:24px;text-align:center}
.play-orb{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;
  position:relative;box-shadow:0 0 0 12px rgba(255,255,255,.12),0 30px 60px -20px rgba(0,0,0,.6);
  transition:transform .25s}
.poster:hover .play-orb{transform:scale(1.06)}
.orb-fallback{font-size:38px;font-weight:800;color:var(--brand);position:absolute}
.play-orb img{width:52px;height:52px;object-fit:contain;position:relative;z-index:1}
.play-tri{position:absolute;right:-4px;bottom:-4px;width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#5b4bff,#00b8ff);display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(91,75,255,.5);z-index:2}
.play-tri::before{content:'';width:0;height:0;border-left:9px solid #fff;
  border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.poster-text span{display:block;font-size:9.5px;letter-spacing:3px;color:#aab0d0;font-weight:800}
.poster-text b{display:block;font-size:17px;color:#fff;margin:6px 0 4px;font-weight:700;max-width:420px}
.poster-text small{font-size:10.5px;color:#8b93b8;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.poster.loading .play-orb::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(91,75,255,.3);border-top-color:var(--brand);animation:spin 1s linear infinite}
.video-foot{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:#0e1120;border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.video-foot b{display:block;color:#fff;font-size:13.5px;margin-top:3px}
.vf-tag{font-size:8.5px;letter-spacing:2.4px;color:#8b93b8;font-weight:800}
.vf-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.done-chip{font-size:9px;font-weight:800;letter-spacing:1.2px;color:#4ade80;
  background:rgba(14,171,122,.12);border:1px solid rgba(14,171,122,.25);padding:6px 10px;
  border-radius:999px;white-space:nowrap}
.player-note{margin-top:14px;font-size:11px;line-height:1.7;color:var(--muted);
  display:flex;gap:8px;align-items:flex-start}
.player-note svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:var(--brand)}

/* sidebar */
.side-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;
  box-shadow:var(--shadow-sm);margin-bottom:14px}
.ring{--p:0;width:112px;height:112px;border-radius:50%;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#eef0f8 0);
  display:grid;place-items:center;position:relative;margin:4px auto 0}
.ring::before{content:'';position:absolute;inset:9px;border-radius:50%;background:#fff}
.ring-in{position:relative;z-index:1;text-align:center}
.ring-in b{display:block;font-size:21px;letter-spacing:-.8px}
.ring-in span{display:block;font-size:8px;letter-spacing:1.6px;color:var(--muted);font-weight:800;margin-top:2px}
.side-caption{text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:12px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.side-head b{font-size:12.5px}
.side-head span{font-size:9.5px;font-weight:800;color:var(--muted);font-family:'JetBrains Mono',monospace}
.lessons{display:grid;gap:7px;margin-top:12px}
.lesson{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;
  border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;transition:.2s;width:100%}
.lesson:hover{background:#f8f9fe;border-color:var(--line-2)}
.lesson.active{border-color:var(--brand);
  background:linear-gradient(90deg,rgba(91,75,255,.07),rgba(0,184,255,.03))}
.lesson.done .lesson-num{background:var(--ok);color:#fff;border-color:var(--ok)}
.lesson-num{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:0 0 auto;
  color:var(--muted);background:#fff}
.lesson-body b{display:block;font-size:12px;line-height:1.35;font-weight:700}
.lesson-body small{font-size:8.5px;letter-spacing:1.2px;color:var(--muted);font-weight:800;
  text-transform:uppercase;display:block;margin-top:2px}

/* certificate */
.cert-page{max-width:1040px;margin:0 auto}
.cert-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  flex-wrap:wrap;margin-bottom:18px}
.cert-head h1{font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.4px;margin-top:8px}
.cert-head p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.cert{position:relative;background:#fff;border-radius:30px;border:1px solid var(--line);
  box-shadow:0 50px 120px -50px rgba(20,24,70,.45);overflow:hidden}
.cert-bar{height:7px;background:linear-gradient(90deg,#5b4bff 0%,#00b8ff 42%,#ff4d9d 78%,#ffb020 100%)}
.cert-inner{padding:38px 44px 30px;position:relative;overflow:hidden}
.cert-inner::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(91,75,255,.10) 1px,transparent 1px);
  background-size:18px 18px;opacity:.5;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 62%);
  mask-image:linear-gradient(180deg,#000,transparent 62%)}
.cert-inner > *{position:relative;z-index:1}
.cert-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.cert-brand{display:flex;align-items:center;gap:11px}
.cert-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#5b4bff,#00b8ff);
  display:grid;place-items:center;position:relative;overflow:hidden;color:#fff;font-weight:800;font-size:20px}
.cert-logo img{position:absolute;inset:0;margin:auto;width:32px;height:32px;object-fit:contain;
  background:#fff;border-radius:8px;padding:3px}
.cert-brand b{display:block;letter-spacing:2px;font-size:13.5px}
.cert-brand small{display:block;font-size:8.5px;letter-spacing:1.8px;color:var(--muted);
  font-weight:800;margin-top:2px}
.cert-verified{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;
  background:#ecfdf5;border:1px solid #c7f2df;color:#0e8a62;font-size:9px;font-weight:800;
  letter-spacing:1.4px;white-space:nowrap}
.v-dot{width:7px;height:7px;border-radius:50%;background:#0eab7a;
  box-shadow:0 0 0 3px rgba(14,171,122,.18)}
.cert-kicker{text-align:center;margin-top:30px;font-size:10px;letter-spacing:5px;font-weight:800;
  color:var(--brand)}
.cert-name{text-align:center;font-size:clamp(36px,5vw,56px);font-weight:800;letter-spacing:-1.8px;
  line-height:1.04;margin:12px 0 6px;color:var(--ink);word-break:break-word}
.cert-lead{text-align:center;color:var(--muted);font-size:12.5px}
.cert-course{text-align:center;font-size:clamp(17px,2.3vw,25px);font-weight:800;letter-spacing:-.4px;
  margin:8px 0 28px;color:var(--cc,#5b4bff)}
.cert-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:0 0 26px}
.cert-stats > div{background:#f8f9fe;border:1px solid var(--line);border-radius:14px;
  padding:12px 10px;text-align:center;min-width:0}
.cert-stats span{display:block;font-size:7.5px;letter-spacing:1.5px;color:var(--muted);
  font-weight:800;margin-bottom:5px}
.cert-stats b{font-size:11.5px;font-weight:800;word-break:break-word;display:block;line-height:1.35}
.cert-stats .ok{color:var(--ok)}
.cert-bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding-top:20px;border-top:1px dashed var(--line-2);flex-wrap:wrap}
.cert-sign{min-width:170px}
.sign-line{width:146px;height:1px;background:var(--ink);opacity:.35;margin-bottom:8px}
.cert-sign b{display:block;font-size:12.5px}
.cert-sign span{font-size:9px;color:var(--muted);letter-spacing:1.2px;font-weight:800}
.cert-qr{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:74px;height:74px;
  padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff;flex:0 0 auto}
.cert-qr i{background:#eef0f8;border-radius:1px}
.cert-qr i.on{background:var(--ink)}
.cert-seal{width:84px;height:84px;border-radius:50%;
  background:conic-gradient(from 0deg,#5b4bff,#00b8ff,#0eab7a,#ffb020,#ff4d9d,#5b4bff);
  padding:4px;animation:spin 14s linear infinite;flex:0 0 auto}
.cert-seal > div{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;
  place-items:center;text-align:center;font-size:8px;font-weight:800;letter-spacing:1.1px;
  color:var(--ok);line-height:1.45}
.cert-url{text-align:center;margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:8px;
  color:var(--muted);word-break:break-all;line-height:1.6}
.cert-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.cert-hint{text-align:center;margin-top:16px;font-size:10.5px;color:var(--muted);line-height:1.7}
.cert-hint b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:10px}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:18px;
  background:rgba(11,13,23,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#modal.show{display:grid}
.modal{width:min(520px,100%);background:#fff;border-radius:26px;padding:28px;position:relative;
  box-shadow:0 40px 100px -30px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:13px;
  color:var(--muted);transition:.2s}
.modal-x:hover{background:#f3f4fb;color:var(--ink)}
.modal-course{display:flex;gap:14px;align-items:flex-start;padding-right:26px}
.modal-icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;
  background:var(--c-soft);border:1px solid var(--c-line);flex:0 0 auto}
.modal-tag{font-size:8.5px;letter-spacing:1.6px;font-weight:800;color:var(--muted);text-transform:uppercase}
.modal-course h3{font-size:20px;letter-spacing:-.5px;margin:3px 0 5px}
.modal-course p{font-size:11.5px;line-height:1.55;color:var(--muted)}
.modal-info{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.modal-info span{font-size:9px;letter-spacing:1px;font-weight:800;color:var(--muted);
  background:#f3f4fb;border:1px solid var(--line);padding:6px 9px;border-radius:999px}
.modal-warn{font-size:11px;line-height:1.6;color:#b45309;background:#fff7ed;border:1px solid #ffe0b2;
  border-radius:12px;padding:11px 12px;margin:12px 0 16px}
.modal .btn-block{margin-top:8px}
.modal .field input{padding-left:16px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:120;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;
  padding:0 16px}
.toast-item{background:#0b0d17;color:#fff;padding:12px 18px;border-radius:14px;font-size:12.5px;
  font-weight:700;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);animation:toastIn .3s;
  max-width:520px;text-align:center;line-height:1.45}
.toast-item.ok{background:#0e8a62}
.toast-item.warn{background:#b45309}
.toast-item.err{background:#b42318}
.toast-item.out{opacity:0;transform:translateY(8px);transition:.4s}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* confetti */
.confetti{position:fixed;inset:0;z-index:110;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:16px;border-radius:2px;
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r,360deg));opacity:.9}}

/* spinner */
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* responsive */
@media(max-width:980px){
  .auth{grid-template-columns:1fr}
  .auth-art{min-height:auto;padding:36px}
  .auth-form{padding:36px}
  .courses{grid-template-columns:repeat(2,1fr)}
  .course.featured{grid-column:span 2;flex-direction:column;align-items:flex-start}
  .feat-visual{display:none}
  .player-grid{grid-template-columns:1fr}
  .cert-inner{padding:30px 22px}
  .cert-stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .topbar-in{padding:10px 16px}
  .wrap,.player-wrap{padding-left:16px;padding-right:16px}
  .courses{grid-template-columns:1fr}
  .course.featured{grid-column:span 1}
  .dash-hero{flex-direction:column;align-items:flex-start}
  .dash-stats{width:100%}
  .stat{flex:1;min-width:90px}
  .denied{padding:34px 22px;margin:30px auto}
  .cert-bottom{justify-content:center;text-align:center}
  .cert-sign{text-align:center;margin:auto}
  .sign-line{margin:0 auto 8px}
  .cert-seal{width:74px;height:74px}
  .cert-qr{width:66px;height:66px}
  .continue-progress{width:100%}
  .continue-track{flex:1;width:auto}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
