<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Level Subdomain Router</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 450px; width: 100%; }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .badge { background: #0284c7; color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card" id="app">
        <h1>Loading Subdomain...</h1>
        <p>Please wait while router processes the request.</p>
    </div>

    <script>
        async function resolveSubdomains() {
            const app = document.getElementById('app');
            try {
                const hostname = window.location.hostname; // e.g., taqi.lyra.pages.dev ya admin.taqi.domain.com
                const parts = hostname.split('.');
                
                // Multi-level subdomain extract karne ka logic
                let subKey = 'main';
                if (parts.length > 2) {
                    // Domain ke pehle ke saare parts ko combine karke key bana lenge (jaise taqi ya admin.taqi)
                    subKey = parts.slice(0, parts.length - 2).join('.'); 
                }

                if (subKey === 'main' || !subKey || subKey === 'www') {
                    app.innerHTML = `
                        <h1>Main Hub</h1>
                        <p>Yeh main domain ka root page hai.</p>
                    `;
                    return;
                }

                const res = await fetch('./data.json');
                const routes = await res.json();

                if (routes[subKey]) {
                    const fileRes = await fetch(routes[subKey]);
                    if (!fileRes.ok) throw new Error("Target HTML file not found!");
                    const pageHtml = await fileRes.text();
                    
                    document.open();
                    document.write(pageHtml);
                    document.close();
                } else {
                    app.innerHTML = `
                        <h1>Subdomain Not Found</h1>
                        <p>Subdomain <span class="badge">${subKey}</span> data.json mein registered nahi hai.</p>
                    `;
                }
            } catch (err) {
                app.innerHTML = `<h1>Error</h1><p>${err.message}</p>`;
            }
        }
        resolveSubdomains();
    </script>
</body>
</html>
