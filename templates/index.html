<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ title }} — Created by {{ created_by }}</title>
<link rel="icon" href="{{ icon }}" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -100px, #1a237e 0%, #0b0f1a 55%, #06080f 100%);
    color: #e8ecf1;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 40px 16px 12px;
  }
  .logo {
    width: 96px; height: 96px;
    border-radius: 22px;
    object-fit: cover;
    box-shadow: 0 12px 40px rgba(120, 140, 255, .35), 0 0 0 3px rgba(255,255,255,.06);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
  h1 {
    margin: 14px 0 4px;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: 6px;
    background: linear-gradient(90deg, #7ee8ff, #b39dff, #ff8cc8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { margin: 0; color: #a4b0c4; font-size: 1rem; }
  .sub b { color: #fff; letter-spacing: 1px; }
  main { max-width: 1100px; margin: 24px auto 60px; padding: 0 16px; }
  .headline {
    text-align: center;
    margin: 24px 0 6px;
    font-size: clamp(1.05rem, 2.4vw, 1.35rem);
    color: #d7e0ee;
    font-weight: 600;
  }
  .hint { text-align: center; color: #8a97ab; margin: 0 0 22px; font-size: .92rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 18px 16px 14px;
    backdrop-filter: blur(10px);
    transition: transform .15s ease, border-color .15s ease;
    overflow: hidden;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(140, 160, 255, .35); }
  .rank {
    position: absolute; top: 10px; right: 12px;
    font-size: .8rem; color: #7a879c; font-weight: 700;
  }
  .card h3 {
    margin: 0 0 6px; font-size: 1rem; letter-spacing: 1px; color: #fff;
  }
  .desc { margin: 0 0 14px; color: #95a3ba; font-size: .85rem; min-height: 2.4em; }
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    border: 0; border-radius: 10px;
    padding: 10px 12px;
    font-size: .9rem; font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.open {
    background: linear-gradient(180deg, #3b6bff, #2450e6);
    color: #fff;
  }
  .btn.like {
    background: linear-gradient(180deg, #ff4d7a, #d92260);
    color: #fff;
  }
  .btn.like:hover { filter: brightness(1.08); }
  .btn.like:disabled { opacity: .6; cursor: progress; }
  .footer {
    text-align: center; padding: 30px 16px 50px; color: #6f7c91; font-size: .85rem;
  }
  .footer b { color: #b8c4d8; }
</style>
</head>
<body>

<header>
  <img class="logo" src="{{ icon }}" alt="{{ title }} logo" />
  <h1>{{ title }}</h1>
  <p class="sub">Created by <b>{{ created_by }}</b></p>
</header>

<main>
  <p class="headline">Check All Software and Like for Best Software</p>
  <p class="hint" id="hint">Sorted by likes — most-liked first</p>
  <div class="grid" id="list"></div>
</main>

<div class="footer">
  <b>{{ title }}</b> · by <b>{{ created_by }}</b> · Powered by Flask + TryCloudflare
</div>

<script>
async function load() {
  const list = document.getElementById("list");
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    const d = await r.json();
    list.innerHTML = d.items.map((it, i) => `
      <div class="card">
        <div class="rank">#${i + 1}</div>
        <h3>${escapeHtml(it.name)}</h3>
        <p class="desc">${escapeHtml(it.description || "")}</p>
        <div class="actions">
          <a class="btn open" href="${it.url}" target="_blank" rel="noopener">Open</a>
          <button class="btn like" data-id="${it.id}" onclick="like('${it.id}', this)">
            ❤ <span class="count">${it.likes}</span>
          </button>
        </div>
      </div>
    `).join("");
    document.getElementById("hint").textContent =
      `Sorted by likes — most-liked first · Total ❤️ ${d.total_likes}`;
  } catch (e) {
    list.innerHTML = `<p style="color:#ff8">Failed to load data: ${e}</p>`;
  }
}

async function like(id, btn) {
  btn.disabled = true;
  try {
    await fetch("/api/like", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id }),
    });
    await load();
  } catch (e) {
    btn.disabled = false;
    alert("Like failed: " + e);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

load();
</script>
</body>
</html>
